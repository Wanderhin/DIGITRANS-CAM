version: '3.8'

services:
  db:
    image: mysql:8
    container_name: crm-db
    restart: always
    environment:
      MYSQL_DATABASE: digitranscm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment the next line and add init script if you want to initialize the DB automatically
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./crmBackend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/digitranscm?createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  frontend:
    build:
      context: ./crmFrontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
