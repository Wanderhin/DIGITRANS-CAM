<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Connexion au CRM
    </h2>
    <div class="mt-8 bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="error" class="text-red-500 text-sm text-center">{{error}}</div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" formControlName="email"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input type="password" formControlName="password"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md sm:text-sm">
        </div>
        <button type="submit" [disabled]="loading || loginForm.invalid"
                class="w-full py-2 px-4 bg-slate-600 hover:bg-slate-700 text-white rounded-md disabled:opacity-50">
          {{loading ? 'Connexion...' : 'Se connecter'}}
        </button>
      </form>
    </div>
  </div>
</div>
