spring.application.name=crmBackend
spring.datasource.url=jdbc:mysql://localhost:3306/digitranscm?createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jackson.date-format=dd-MM-yyyy



# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Exposer les points de monitoring (Santé et Métriques)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


logging.level.org.springframework.security=DEBUG
logging.level.com.exemple.crmbackend=INFO
# Niveau de log pour votre application
logging.level.com.exemple.crmbackend.controllers=info
logging.level.com.exemple.crmbackend.services=info
logging.level.com.exemple.crmbackend.config.LogginAspect=INFO
# Niveau de log pour Spring
logging.level.org.springframework.web=debug


# Format des logs en console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# Configuration des dossiers
app.pdf.output.directory=./pdfs
app.photos.directory=./photos

# Configuration Multipart (uploads de fichiers)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Répertoire de stockage des fichiers
file.upload-dir=./uploads
